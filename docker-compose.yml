# Lokal / istənilən VPS:   cp .env.example .env && docker compose up -d --build
# Caddy avtomatik Let's Encrypt TLS sertifikatı alır (DOMAIN). Domen yoxdursa: DOMAIN=<IP>.sslip.io
services:
  app:
    build: .
    env_file: .env
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    volumes: [emanet-data:/data]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    expose: ["8000"]
    pids_limit: 200
    mem_limit: 512m

  # AWS-dən kənar yerləşdirmədə planlaşdırıcı: hər saat "tick" (AWS-də bunu EventBridge+Lambda edir)
  ticker:
    build: .
    env_file: .env
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    volumes: [emanet-data:/data]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    entrypoint: ["sh", "-c", "while true; do python -m emanet.cli tick; sleep 3600; done"]
    profiles: ["standalone"]

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    depends_on: [app]

volumes:
  emanet-data:
  caddy-data:
